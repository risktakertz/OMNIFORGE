# OMNIFORGE upstream integration catalog
#
# Tier: C = foundation, P = prioritized capability, O = optional/on-demand, X = evaluate only.
# Status vocabulary (honest, matches packages/shared-types Availability):
#   verified    - smoke-tested operational in this repository
#   configured  - present/loadable, not yet operationally proven here
#   untested    - recorded with a documented integration path, not yet exercised
#   blocked     - prerequisites absent (toolchain/credentials); never simulated
#
# Licenses were reviewed against official sources at bootstrap (2026-10-31) and
# MUST be re-verified at each integration update (docs/LICENSE_COMPLIANCE.md).
# Cost reflects the project's own license/pricing posture, not your usage bill.

version: 1
recorded: "2026-10-31"

